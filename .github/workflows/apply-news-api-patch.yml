name: Apply Direct ESPN API Patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_news_api.py
      - .github/workflows/apply-news-api-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply direct ESPN API patch
        run: python scripts/patch_news_api.py

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes detected."
            exit 0
          fi
          git commit -m "Replace ESPN RSS feed with direct ESPN site API"
          git push
