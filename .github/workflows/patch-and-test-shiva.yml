name: Test Shiva Intelligence App

on:
  push:
    branches: [main]
    paths:
      - app.py
      - shiva_app_v3.py
      - shiva_app_v2.py
      - mock_draft_engine.py
      - mock_draft_ui_v2.py
      - mock_draft_players_espn.py
      - mobile_bottom_nav_fix.py
      - player_profile.py
      - shiva_chatgpt_service.py
      - shiva_query_router.py
      - draft_decision_engine.py
      - shiva_engine.py
      - current_rankings.csv
      - player_birth_dates.csv
      - player_weekly_master_2014_2025.csv.gz
      - shiva_draft_roi.sqlite
      - .github/workflows/patch-and-test-shiva.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shiva-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production modules
        run: python -m py_compile app.py shiva_app_v3.py shiva_app_v2.py mock_draft_engine.py mock_draft_ui_v2.py mock_draft_players_espn.py mobile_bottom_nav_fix.py streamlit_branding_fix.py player_profile.py shiva_chatgpt_service.py shiva_query_router.py draft_decision_engine.py shiva_engine.py

      - name: Import production modules
        run: python -c "import streamlit as st; import shiva_app_v3, mock_draft_engine, mock_draft_ui_v2, mock_draft_players_espn, player_profile; print('Streamlit', st.__version__, 'production imports OK')"

      - name: Verify active mock draft and engine synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          from mock_draft_engine import initialize_draft, start_draft, queue_add, queue_remove, make_pick, roster_slots, undo_last_pick

          base = Path('mock_draft_ui_v2.py').read_text()
          active = Path('mock_draft_players_espn.py').read_text()
          app = Path('app.py').read_text()
          shell = Path('shiva_app_v3.py').read_text()
          profile = Path('player_profile.py').read_text()

          for marker in ['PLAYERS_AVAILABLE', 'QUEUE', 'DRAFT_BOARD', 'ROSTER']:
              assert marker in base
          assert 'render_espn_players_available' in app
          assert 'player-table-header' in active and 'queue_btn_' in active
          assert 'base.queue_add(state, pid)' in active and 'base.queue_remove(state, pid)' in active
          assert 'base.make_pick(state, pid, source="user")' in active
          assert 'base.player_link_html' in active
          assert 'roster_slots(state, state["userTeamId"])' in base
          assert 'grid-template-columns:repeat({teams},minmax(0,1fr))' in base
          assert 'MY TEAM IQ' in shell and '_team_iq(roi, weekly)' in shell
          assert 'canonical_player_id' in shell and 'linkify_player_names' in shell
          assert 'player_id' in profile and 'profile-years' in profile and 'profile-log' in profile

          players = [
              {'id':'p1','name':'Test RB','position':'RB','team':'ATL','adp':1.0,'rank':1,'bye':5,'projected_points':250.0,'isAvailable':True},
              {'id':'p2','name':'Test WR','position':'WR','team':'MIN','adp':2.0,'rank':2,'bye':6,'projected_points':245.0,'isAvailable':True},
          ]
          state = initialize_draft(players, teams_count=8, draft_position=1, scoring='PPR', rounds=10, seconds_per_pick=90)
          start_draft(state)
          queue_add(state, 'p1')
          assert state['queue'] == ['p1']
          queue_remove(state, 'p1')
          assert state['queue'] == []
          queue_add(state, 'p1')
          make_pick(state, 'p1', source='user')
          assert 'p1' not in state['queue']
          assert all(p['id'] != 'p1' for p in state['availablePlayers'])
          user_team = next(t for t in state['teams'] if t['id'] == state['userTeamId'])
          assert any(p['id'] == 'p1' for p in user_team['roster'])
          slots = roster_slots(state, state['userTeamId'])
          assert any(slot == 'RB' and p and p['id'] == 'p1' for slot, p in slots)
          assert state['picks'][0]['playerId'] == 'p1'
          undo_last_pick(state)
          assert any(p['id'] == 'p1' for p in state['availablePlayers'])
          print('Active mock presentation and engine synchronization passed')
          PY

      - name: Validate current ranking data contract
        run: |
          python - <<'PY'
          import pandas as pd
          from mock_draft_engine import build_player_pool

          rankings = pd.read_csv('current_rankings.csv')
          required = {'player_name','team','bye','position','adp','overall_rank'}
          assert required.issubset(rankings.columns), required - set(rankings.columns)
          assert len(rankings) >= 100, len(rankings)
          assert rankings['player_name'].dropna().astype(str).str.strip().ne('').all()
          assert rankings['adp'].notna().sum() >= 100
          pool = build_player_pool(rankings)
          assert len(pool) >= 100, len(pool)
          assert len({p['id'] for p in pool}) == len(pool)
          assert all(p['position'] in {'QB','RB','WR','TE','D/ST','K'} for p in pool)
          # Projections are optional. The UI must show a dash when verified projections are absent.
          if 'projected_points' not in rankings.columns:
              assert all(p['projected_points'] is None for p in pool)
              print('Current rankings validated; verified projection field is not present, so UI fallback is required')
          else:
              print('Current rankings and projections validated')
          PY

      - name: Validate historical player seasons and Full PPR scoring
        run: |
          python - <<'PY'
          import pandas as pd
          from player_profile import _weekly_for_player, canonical_player_id, _points

          path = 'player_weekly_master_2014_2025.csv.gz'
          header = pd.read_csv(path, compression='gzip', nrows=0).columns.tolist()
          wanted = [c for c in [
              'season','week','season_type','player_id','player_display_name','player_name','name',
              'position','recent_team','team','opponent_team','opponent','fantasy_points_ppr',
              'passing_yards','passing_tds','interceptions','rushing_yards','rushing_tds',
              'receptions','receiving_yards','receiving_tds','fumbles_lost',
              'passing_two_point_conversions','rushing_two_point_conversions','receiving_two_point_conversions'
          ] if c in header]
          weekly = pd.read_csv(path, compression='gzip', usecols=wanted, low_memory=False)

          cmc_id = canonical_player_id(weekly, 'Christian McCaffrey')
          cmc = _weekly_for_player(weekly, cmc_id, 'Christian McCaffrey')
          years = sorted(pd.to_numeric(cmc['season'], errors='coerce').dropna().astype(int).unique().tolist(), reverse=True)
          assert years and min(years) <= 2017 and max(years) >= 2025, years

          check = weekly.copy()
          if 'season_type' in check.columns:
              check = check[check['season_type'].astype(str).str.upper().isin(['REG','REGULAR','REGULAR SEASON'])]
          check = check[pd.to_numeric(check['fantasy_points_ppr'], errors='coerce').notna()].head(5000).copy()
          calc = _points(check)
          actual = pd.to_numeric(check['fantasy_points_ppr'], errors='coerce')
          diff = (calc - actual).abs().dropna()
          assert not diff.empty
          assert float(diff.quantile(.95)) <= 0.11, diff.describe().to_dict()
          print('Historical years and ESPN Full PPR scoring validation passed', years)
          PY

      - name: Run Shiva deterministic regression suite
        run: python scripts/regression_checks.py
