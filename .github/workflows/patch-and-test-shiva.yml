name: Test Shiva App

on:
  push:
    branches: [main]
    paths:
      - app.py
      - shiva_query_router.py
      - shiva_chatgpt_service.py
      - mock_draft_engine.py
      - mock_draft_ui.py
      - player_profile.py
      - shiva_mobile_home.py
      - scripts/regression_checks.py
      - scripts/mock_draft_regression.py
      - scripts/patch_reference_mock_ui.py
      - scripts/patch_reference_app.py
      - .github/workflows/patch-and-test-shiva.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-shiva-app:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pandas numpy openai streamlit

      - name: Integrate reference layouts
        run: |
          python scripts/patch_reference_mock_ui.py
          python scripts/patch_reference_app.py

      - name: Run Ask Shiva regression checks
        run: python scripts/regression_checks.py

      - name: Run all 26 Mock Draft regression checks
        run: python scripts/mock_draft_regression.py

      - name: Verify reference mock draft layout
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('mock_draft_ui.py').read_text()
          assert 'MOCK DRAFT' in s
          assert '["PLAYERS", "DRAFT BOARD", "QUEUE", "TEAM", "RESULTS"]' in s
          assert 'mock_board_scroll' in s
          assert 'playerrow_' in s
          assert 'open_player_profile' in s
          print('Reference mock draft layout + clickable player routing present')
          PY

      - name: Verify mobile home and profile routing
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text()
          home = Path('shiva_mobile_home.py').read_text()
          profile = Path('player_profile.py').read_text()
          assert 'render_home' in app and 'render_bottom_navigation' in app
          assert 'Player Profiles' in app and 'Player Profile' in app
          assert 'opponent_team' in app
          assert 'DRAFT BOARD' in home and 'MOCK DRAFT' in home and 'ASK SHIVA GPT' in home
          assert 'GAME LOG · WEEK 1-17' in profile
          assert 'render_player_directory' in profile
          assert 'open_player_profile' in profile
          print('Home, bottom nav, player directory and year-selectable profiles present')
          PY

      - name: Verify resource-safe weekly loader
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          assert '@st.cache_resource(show_spinner=False)\ndef load_weekly' in s
          assert 'usecols=usecols or None' in s
          print('Resource-safe weekly loader present')
          PY

      - name: Verify live timer fragment exists
        run: python -c "from pathlib import Path; s=Path('mock_draft_ui.py').read_text(); assert '@st.fragment(run_every=\"1s\")' in s and '_live_timer_fragment()' in s"

      - name: Import production modules
        run: python -c "import streamlit as st; import mock_draft_engine; import mock_draft_ui; import player_profile; import shiva_mobile_home; print('Streamlit', st.__version__, 'imports OK')"

      - name: Compile production modules
        run: python -m py_compile app.py shiva_chatgpt_service.py shiva_query_router.py mock_draft_engine.py mock_draft_ui.py player_profile.py shiva_mobile_home.py

      - name: Commit integrated reference screens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py mock_draft_ui.py
          if git diff --cached --quiet; then
            echo "All reference integrations already present."
            exit 0
          fi
          git commit -m "Match reference mobile home mock draft and player profiles"
          git push
