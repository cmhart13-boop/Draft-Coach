name: Test Shiva App

on:
  push:
    branches: [main]
    paths:
      - shiva_query_router.py
      - shiva_chatgpt_service.py
      - mock_draft_engine.py
      - mock_draft_ui.py
      - scripts/regression_checks.py
      - scripts/mock_draft_regression.py
      - scripts/patch_mock_draft_room.py
      - scripts/patch_mock_timer.py
      - scripts/refresh_mock_draft_layout.py
      - scripts/optimize_streamlit_resources.py
      - .github/workflows/patch-and-test-shiva.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-shiva-app:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pandas numpy openai streamlit

      - name: Integrate app patches
        run: |
          python scripts/patch_mock_draft_room.py
          python scripts/patch_mock_timer.py
          python scripts/refresh_mock_draft_layout.py
          python scripts/optimize_streamlit_resources.py

      - name: Run Ask Shiva regression checks
        run: python scripts/regression_checks.py

      - name: Run all 26 Mock Draft regression checks
        run: python scripts/mock_draft_regression.py

      - name: Verify traditional player list and colored draft board
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('mock_draft_ui.py').read_text()
          assert 'Players are stacked by 2026 rank / ADP' in s
          assert 'st.segmented_control(' in s
          assert '["ALL", "QB", "RB", "WR", "TE", "D/ST", "K"]' in s
          assert 'mock-board-cell.pos-rb' in s
          assert 'mock-board-cell.pos-wr' in s
          assert 'mock-board-legend' in s
          print('Traditional player list + colored board present')
          PY

      - name: Verify resource-safe weekly loader
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          assert '@st.cache_resource(show_spinner=False)\ndef load_weekly' in s
          assert 'usecols=usecols or None' in s
          assert 'return pd.read_csv(WEEKLY_PATH, low_memory=False, compression="gzip")' not in s
          print('Resource-safe weekly loader present')
          PY

      - name: Verify live timer fragment exists
        run: python -c "from pathlib import Path; s=Path('mock_draft_ui.py').read_text(); assert '@st.fragment(run_every=\"1s\")' in s and '_live_timer_fragment()' in s"

      - name: Import production modules
        run: python -c "import streamlit as st; import mock_draft_engine; import mock_draft_ui; print('Streamlit', st.__version__, 'imports OK')"

      - name: Compile production modules
        run: python -m py_compile app.py shiva_chatgpt_service.py shiva_query_router.py mock_draft_engine.py mock_draft_ui.py

      - name: Commit integrated app if patches changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py mock_draft_ui.py
          if git diff --cached --quiet; then
            echo "All integrations already present."
            exit 0
          fi
          git commit -m "Refresh mock draft layout"
          git push
