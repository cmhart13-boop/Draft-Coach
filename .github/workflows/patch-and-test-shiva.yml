name: Test Ask Shiva GPT

on:
  push:
    branches: [main]
    paths:
      - shiva_query_router.py
      - shiva_chatgpt_service.py
      - scripts/regression_checks.py
      - .github/workflows/patch-and-test-shiva.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ask-shiva:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pandas numpy openai streamlit

      - name: Run Ask Shiva regression checks
        run: python scripts/regression_checks.py

      - name: Compile production Ask Shiva modules
        run: python -m py_compile app.py shiva_chatgpt_service.py shiva_query_router.py
